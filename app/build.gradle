plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.gastroconnect.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.gastroconnect.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}