name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare tag
        run: echo "TAG=v0.1.0-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: gastroconnect-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "gastroconnect-$TAG.apk"
          gh release create "$TAG" "gastroconnect-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GastroConnect $TAG" \
            --notes "Android-приложение GastroConnect (WebView-оболочка https://gastroconnect.ru/).

Установка: скачать APK, разрешить установку из неизвестных источников."